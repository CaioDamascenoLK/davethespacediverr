function beep(freq,type,dur,vol,freqEnd){
  if(AC.state==='suspended')AC.resume()
  const o=AC.createOscillator(),g=AC.createGain()
  o.connect(g);g.connect(AC.destination)
  o.type=type
  o.frequency.setValueAtTime(freq,AC.currentTime)
  if(freqEnd)o.frequency.linearRampToValueAtTime(freqEnd,AC.currentTime+dur)
  g.gain.setValueAtTime(vol,AC.currentTime)
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur)
  o.start();o.stop(AC.currentTime+dur)
}

const keys={}
document.addEventListener('keydown',e=>{
  if(!keys[e.code])keys[e.code]={held:false,just:false}
  if(!keys[e.code].held)keys[e.code].just=true
  keys[e.code].held=true
  if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault()
})
document.addEventListener('keyup',e=>{ if(keys[e.code]){keys[e.code].held=false;keys[e.code].just=false} })
function clearJust(){ for(const k in keys)keys[k].just=false }
const pressed = c=>keys[c]&&keys[c].just

function localToWorldMouse(evt){
  const rect=CV.getBoundingClientRect()
  const x=(evt.clientX-rect.left)*(CV.width/rect.width)
  const y=(evt.clientY-rect.top)*(CV.height/rect.height)
  mouseAim.x=Math.max(0,Math.min(W,x))
  mouseAim.y=Math.max(0,Math.min(H,y))
  mouseAim.worldX=mouseAim.x+camX
  mouseAim.worldY=mouseAim.y
  mouseAim.valid=true
}
CV.addEventListener('mousemove',localToWorldMouse)
CV.addEventListener('mouseleave',()=>{mouseAim.valid=false})

    const y = type==='floater' ? 150 + Math.random()*50 : 226
    enemyObjs.push({
      x:x, y:y, w:16, h:16,
      ox:x, oy:y, range:55 + Math.random()*35, speed:1.6 + Math.random()*0.8,
      dir:1, dead:false, type:type, baseSpeed:1.6 + Math.random()*0.8,
      shootTimer:80, alertTimer:0, charging:false, angle:0, chargeTimer:0, chargeCooldown:0
    })
  }
  
  pl.x = 50; pl.y = 210
}

// Função de carga de nível
function loadLevel(levelNum) {
  switch(levelNum) {
    case 1: loadLevel1(); break
    case 2: loadLevel2(); break
    case 3: loadLevel3(); break
    case 4: loadLevel4(); break
    case 5: loadLevel5(); break

}

  ]
  currentTutorialStep = 0
  tutorialMessageActive = false
  currentTutorialMessage = null
  tutorialMessageTimer = 0
}

function updateTutorial() {
  if(selectedLevel !== 1) return
  if(currentTutorialStep >= tutorialSteps.length) return
  
  if(tutorialMessageActive) {
    tutorialMessageTimer--
    if(tutorialMessageTimer <= 0) {
      tutorialMessageActive = false
      currentTutorialMessage = null
    }
    return
  }
  
  const step = tutorialSteps[currentTutorialStep]
  if(!step.done && pl.x >= step.triggerX) {
    step.done = true
    currentTutorialMessage = {
      text: step.msg,
      x: step.x,
      y: step.y,
      timer: 180
    }
    tutorialMessageActive = true
    tutorialMessageTimer = 180
    currentTutorialStep++
    sfxCollect()
  }
}

function drawTutorialMessages() {
  if(!tutorialMessageActive || !currentTutorialMessage) return
  
  const msg = currentTutorialMessage
  let screenX = msg.x - camX
  let screenY = msg.y
  
  if(screenX < -50 || screenX > W + 50) return
  screenX = Math.max(30, Math.min(W - 150, screenX))
  
  cx.save()
  cx.font = 'bold 9px monospace'
  cx.textAlign = 'center'
  cx.fillStyle = 'rgba(0,0,0,0.85)'
  cx.fillRect(screenX-10, screenY-18, 220, 32)
  cx.fillStyle = '#0f0'
  cx.strokeStyle = '#0f0'
  cx.lineWidth = 1.5
  cx.strokeRect(screenX-10, screenY-18, 220, 32)
  cx.fillStyle = '#0f0'
  cx.fillText(msg.text, screenX+100, screenY-2)
  cx.fillStyle = '#ff0'
  cx.beginPath()
  cx.moveTo(screenX+100, screenY+18)
  cx.lineTo(screenX+92, screenY+10)
  cx.lineTo(screenX+108, screenY+10)
  cx.fill()
  cx.restore()
}

// ==================== FUNÇÕES PRINCIPAIS ====================

function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y }
function resolveY(obj,plat){
  if(!aabb(obj,plat))return false
  const oT=(obj.y+obj.h)-plat.y, oB=(plat.y+plat.h)-obj.y
  if(obj.vy>=0&&oT<oB){ obj.y=plat.y-obj.h; obj.vy=0; return true }
  if(obj.vy<0&&oB<oT){  obj.y=plat.y+plat.h; obj.vy=0; return true }
  return false
}
function resolveX(obj,plat){
  if(!aabb(obj,plat))return false
  const oL=(obj.x+obj.w)-plat.x, oR=(plat.x+plat.w)-obj.x
  if(obj.vx>0&&oL<oR){ obj.x=plat.x-obj.w; obj.vx=0; return true }
  if(obj.vx<0&&oR<oL){ obj.x=plat.x+plat.w; obj.vx=0; return true }
  return false
}
function allSolids(){ return [...fixedPlats,...movPlats] }
function playerBox(){ return {x:pl.x+2,y:pl.y+2,w:pl.w-4,h:pl.h-2} }

function addParticles(x,y,col,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(Math.random()*1.5+0.5)*(spd||1)
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30+Math.random()*25,ml:55,r:col[0],g:col[1],b:col[2]})
  }
}
function addJetTrail(){
  const ex=pl.x+(pl.face<0?pl.w-2:-2),ey=pl.y+pl.h-3
  particles.push({x:ex+(Math.random()-0.5)*4,y:ey+Math.random()*2,vx:(Math.random()-0.5)*0.8,vy:Math.random()*1.5+0.5,life:14+Math.random()*8,ml:22,r:255,g:120+Math.random()*80|0,b:20})
}

function hurt(){
  if(damageCD>0)return
  lives--;damageCD=130;sfxHurt()
  addParticles(pl.x+pl.w/2,pl.y+pl.h/2,[255,80,60],18)
  if(lives<=0){
    sfxDead();stopBossMusic();stopMusic()
    addParticles(pl.x+pl.w/2,pl.y+pl.h/2,[255,150,50],30)
    deathTimer=80;state='dying'
  } else {
    respawnPlayer()
  }
}

function respawnPlayer(){
  if(checkpointSpawn){
    pl.x=checkpointSpawn.x; pl.y=checkpointSpawn.y
  } else {
    pl.x=50; pl.y=210
  }
  pl.vx=0;pl.vy=0
}

function useHeal(){
  if(healItems<=0||lives>=3||healCD>0)return
  healItems--;lives=Math.min(3,lives+1);healCD=60
  sfxHeal();addParticles(pl.x+pl.w/2,pl.y+pl.h/2,[80,255,120],20,0.8)
}

function shoot(){
  if(shootCD>0||shootOverheat>0)return
  if(shootAmmo<=0){
    shootOverheat=SHOOT_OVERHEAT_MAX
    beep(180,'square',0.08,0.08,90)
    return
  }
  shootCD=18; shootAmmo--;
  if(shootAmmo===0) shootOverheat=SHOOT_OVERHEAT_MAX
  sfxShoot()
  const px=pl.x+pl.w/2, py=pl.y+pl.h/2
  let dx=pl.face, dy=0
  if(mouseAim.valid){
    const tx=mouseAim.worldX, ty=mouseAim.worldY
    const nx=tx-px, ny=ty-py
    const dist=Math.hypot(nx,ny)||1
    dx=nx/dist; dy=ny/dist
    pl.face = dx>=0?1:-1
  }
  bullets.push({x:px-3,y:py-1,vx:dx*6,vy:dy*6,life:75,w:6,h:3})
}

function updateCamera(){
  if(worldW<=W){ camX=0; return }
  const targetCamX = pl.x - W*0.35
  camX += (targetCamX - camX) * 0.12
  camX = Math.max(0, Math.min(worldW - W, camX))
}

function updateMovPlats(){
  for(const mp of movPlats){
    const ox=mp.x,oy=mp.y
    mp.t+=mp.spd*0.03
    if(mp.axis==='x') mp.x=mp.ox+Math.sin(mp.t)*mp.range/2
    else              mp.y=mp.oy+Math.sin(mp.t)*mp.range/2
    if(aabb(pl,mp)){
      const ot=(pl.y+pl.h)-mp.y,ob=(mp.y+mp.h)-pl.y
      if(ot<ob&&pl.vy>=-0.5){
        if(mp.axis==='x')pl.x+=mp.x-ox
        if(mp.axis==='y')pl.y+=mp.y-oy
      }
    }
  }
}

function updateEnemies(){
  if(currentPhase!=='phase1')return
  const plCx=pl.x+pl.w/2, plCy=pl.y+pl.h/2
  for(const e of enemyObjs){
    if(e.dead)continue
    const eCx=e.x+e.w/2, eCy=e.y+e.h/2
    const dx=plCx-eCx, dy=plCy-eCy
    const distToPlayer=Math.hypot(dx,dy)
    e.angle += 0.04

    if(e.type==='grunt'){
      const alertRange=90
      if(distToPlayer<alertRange){ e.alertTimer=40; e.speed=e.baseSpeed*2.2 }
      else if(e.alertTimer>0){ e.alertTimer--; e.speed=e.baseSpeed*1.4 }
      else { e.speed=e.baseSpeed }
      e.x += e.speed * e.dir
      if(e.x < e.ox-e.range || e.x > e.ox+e.range){ e.dir*=-1; e.x=Math.max(e.ox-e.range,Math.min(e.ox+e.range,e.x)) }

    } else if(e.type==='floater'){
      e.y += e.speed * e.dir
      if(e.y < e.oy-e.range || e.y > e.oy+e.range){ e.dir*=-1 }
      if(Math.abs(dx)>20){ e.x += dx>0?0.25:-0.25 }
      e.x = Math.max(e.ox-60, Math.min(e.ox+60, e.x))
      e.shootTimer--
      if(e.shootTimer<=0 && distToPlayer<160){
        e.shootTimer = 110+Math.random()*60|0
        const spd=1.8, ndx=dx/distToPlayer, ndy=dy/distToPlayer
        enemyBullets.push({x:eCx-3,y:eCy-3,vx:ndx*spd,vy:ndy*spd,life:120,w:5,h:5})
        beep(300,'sawtooth',0.06,0.08,150)
      }

    } else if(e.type==='kamikaze'){
      if(e.chargeCooldown>0){ e.chargeCooldown--; e.charging=false }
      if(e.charging){
        e.x += e.chargeVx; e.y += e.chargeVy
        e.chargeTimer--
        if(e.chargeTimer<=0 || e.x<-30 || e.x>worldW+30 || e.y<-30 || e.y>H+30){
          e.charging=false; e.chargeCooldown=90
          e.x=Math.max(e.ox-e.range,Math.min(e.ox+e.range,e.x))
          e.y=e.oy
        }
      } else {
        e.x += e.baseSpeed * e.dir * 0.5
        if(e.x < e.ox-e.range || e.x > e.ox+e.range){ e.dir*=-1 }
        if(distToPlayer<100 && e.chargeCooldown===0){
          e.charging=true; e.chargeTimer=35
          const nd=Math.hypot(dx,dy)||1
          e.chargeVx=dx/nd*3.8; e.chargeVy=dy/nd*3.8
          beep(180,'sawtooth',0.06,0.2,80)
        }
      }

    } else if(e.type==='sniper'){
      e.shootTimer--
      if(e.shootTimer<=0){
        e.shootTimer = 130+Math.random()*40|0
        const spd=2.5, nd=distToPlayer||1
        enemyBullets.push({x:eCx-3,y:eCy-3,vx:dx/nd*spd,vy:dy/nd*spd,life:150,w:6,h:6,sniper:true})
        beep(600,'square',0.04,0.12,400)
        addParticles(eCx,eCy,[255,160,0],8,0.5)
      }
    }
  }
}

function updateEnemyBullets(){
  for(const b of enemyBullets){
    b.x+=b.vx; b.y+=b.vy; b.life--
    for(const p of fixedPlats){if(aabb(b,p)){b.life=0;break}}
    if(b.life>0&&aabb(playerBox(),b)){b.life=0;hurt()}
  }
  enemyBullets=enemyBullets.filter(b=>b.life>0)
}

function updateBoss(){
  if(!boss.alive)return
  if(boss.collisionCooldown>0) boss.collisionCooldown--
  
  const hpR=boss.hp/bossMaxHP
  const shootBase = difficulty==='really-hard'?55 : difficulty==='hard'?70 : 100
  
  if(hpR<=0.65&&boss.phase===1){
    boss.phase=2; boss.shootInterval=Math.round(shootBase*0.75)
    addParticles(boss.x+boss.w/2,boss.y+boss.h/2,[255,100,0],30,1.4)
    healObjs.push({x:120,y:200,got:false})
  }
  if(hpR<=0.35&&boss.phase===2){
    boss.phase=3; boss.shootInterval=Math.round(shootBase*0.45)
    addParticles(boss.x+boss.w/2,boss.y+boss.h/2,[255,20,0],40,1.8)
    healObjs.push({x:360,y:200,got:false})
  }
  if(hpR<=0.15&&boss.phase===3){
    boss.phase=4; boss.shootInterval=Math.round(shootBase*0.25)
    addParticles(boss.x+boss.w/2,boss.y+boss.h/2,[255,0,200],50,2.2)
    beep(80,'sawtooth',0.4,0.5,40); beep(800,'square',0.12,0.3,200)
  }
  if(boss.hurtTimer>0)boss.hurtTimer--
  if(boss.teleportFlash>0)boss.teleportFlash--
  if(boss.patternCD>0)boss.patternCD--
  if(boss.lastTeleportCD>0)boss.lastTeleportCD--

  if(boss.shieldTimer>0){ boss.shieldTimer--; return }

  if(boss.patternCD===0&&boss.patternTimer<=0){
    boss.patternCD = boss.phase>=3?70:100
    boss.patternTimer=0
    const roll=Math.random()
    if(boss.phase===1){
      if(roll<0.45)        boss.movePattern='patrol'
      else if(roll<0.75)   boss.movePattern='dive'
      else                 boss.movePattern='spin'
      boss.patternTimer = boss.movePattern==='patrol' ? 180 : boss.movePattern==='spin' ? 60 : 90
    } else if(boss.phase===2){
      if(roll<0.25)        boss.movePattern='patrol'
      else if(roll<0.45)   boss.movePattern='dive'
      else if(roll<0.62)   boss.movePattern='slam'
      else if(roll<0.78)   boss.movePattern='laser'
      else if(roll<0.88)   boss.movePattern='spin'
      else                 { boss.movePattern='shield'; boss.shieldTimer=55 }
      boss.patternTimer = 110
    } else if(boss.phase===3){
      if(roll<0.15)        boss.movePattern='patrol'
      else if(roll<0.32)   boss.movePattern='dive'
      else if(roll<0.46)   boss.movePattern='slam'
      else if(roll<0.60)   boss.movePattern='burst'
      else if(roll<0.72)   boss.movePattern='spin'
      else if(roll<0.84)   boss.movePattern='laser'
      else if(boss.lastTeleportCD===0){ boss.movePattern='teleport'; boss.lastTeleportCD=240 }
      else                 { boss.movePattern='shield'; boss.shieldTimer=40 }
      boss.patternTimer=90
    } else {
      boss.patternCD=30
      if(roll<0.20)        boss.movePattern='collapse-chase'
      else if(roll<0.40)   boss.movePattern='spin'
      else if(roll<0.58)   boss.movePattern='laser'
      else if(roll<0.72)   boss.movePattern='burst'
      else if(roll<0.86)   { boss.movePattern='slam' }
      else if(boss.lastTeleportCD===0){ boss.movePattern='teleport'; boss.lastTeleportCD=180 }
      else                 boss.movePattern='dive'
      boss.patternTimer=70
    }
    if(boss.movePattern==='dive'){
      boss.diveTarget={x:pl.x+pl.w/2-boss.w/2, y:pl.y+pl.h/2}
      boss.diving=true
      boss.slamWarning=false
    }
    if(boss.movePattern==='slam'){
      boss.slamWarning=true; boss.slamTimer=60; boss.diving=false
    }
    if(boss.movePattern==='teleport'){
      sfxTeleport()
      boss.teleportFlash=24
      const leftTarget = 40
      const rightTarget = W - boss.w - 40
      boss.x = pl.x < W/2 ? rightTarget : leftTarget
      if(Math.abs(boss.x - pl.x) < 80) boss.x = boss.x===leftTarget ? rightTarget : leftTarget
      boss.y = 30
      boss.patternTimer=120
    }
    if(boss.movePattern==='burst'){
      boss.burstCharge=45
      boss.diving=false; boss.slamWarning=false
    }
    if(boss.movePattern==='patrol'){
      boss.diving=false; boss.slamWarning=false
    }
    if(boss.movePattern==='spin'){
      boss.spinAngle=0; boss.spinBursts=boss.phase>=3?3:2
      boss.spinTimer=0; boss.diving=false; boss.slamWarning=false
    }
    if(boss.movePattern==='laser'){
      boss.laserWarning=true; boss.laserTimer=70
      boss.laserX=pl.x+pl.w/2
      boss.laserActive=false; boss.laserActiveTimer=0
      boss.diving=false; boss.slamWarning=false
      beep(400,'sawtooth',0.1,0.15,200)
    }
  }
  boss.patternTimer--

  switch(boss.movePattern){
    case 'patrol':{
      const spd=boss.phase>=3?2.2:boss.phase===2?1.8:1.2
      boss.x+=boss.vx>0?spd:-spd
      if(boss.x<20)          {boss.x=20;boss.vx=1}
      if(boss.x>W-boss.w-20) {boss.x=W-boss.w-20;boss.vx=-1}
      boss.vy+=0.02; boss.y+=boss.vy
      if(boss.y<10){boss.y=10;boss.vy=0}
      if(boss.y>80){boss.y=80;boss.vy=-0.5}
      break
    }
    case 'dive':{
      if(boss.diving){
        const tx=boss.diveTarget.x,ty=boss.diveTarget.y
        const dx=tx-boss.x,dy=ty-boss.y
        const dist=Math.sqrt(dx*dx+dy*dy)||1
        const spd=boss.phase>=3?5.2:boss.phase===2?4.3:3.5
        boss.x+=dx/dist*spd; boss.y+=dy/dist*spd
        if(dist<10){
          boss.diving=false; boss.y=20
          boss.vy=-1.5
          boss.patternTimer=80
          boss.patternCD=40
        }
      } else {
        boss.y-=2; if(boss.y<18){boss.y=18;boss.patternTimer=0}
      }
      break
    }
    case 'slam':{
      if(boss.slamWarning){
        boss.slamTimer--
        if(boss.slamTimer<=0){
          boss.slamWarning=false
          boss.vy=boss.phase>=3?12:9
        }
      } else {
        boss.vy+=0.4; boss.y+=boss.vy
        if(boss.y>=boss.groundY){
          boss.y=boss.groundY; boss.vy=0
          sfxSlam()
          addParticles(boss.x+boss.w/2,boss.groundY+boss.h/2,[255,80,0],35,2.0)
          if(damageCD===0 && Math.abs((pl.x+pl.w/2)-(boss.x+boss.w/2))<70 && pl.y+pl.h>=220){
            hurt()
          }
          boss.patternTimer=80; boss.movePattern='patrol'; boss.patternCD=50
        }
      }
      break
    }
    case 'burst':{
      boss.y=18
      if(boss.burstCharge>0){
        boss.burstCharge--
        if(boss.burstCharge<=0){
          sfxBossShoot()
          const bx=boss.x+boss.w/2, by=boss.y+boss.h
          const dx=(pl.x+pl.w/2)-bx, dy=(pl.y+pl.h/2)-by
          const dist=Math.sqrt(dx*dx+dy*dy)||1
          const base= boss.phase>=3?4.2: boss.phase===2?3.6:3.0
          const angles=[-0.5,-0.25,0,0.25,0.5]
          for(const a of angles){
            const vx=(dx/dist+Math.sin(a))*base
            const vy=(dy/dist+Math.cos(a)*0.2)*base
            bossBullets.push({x:bx-3,y:by,vx:vy?vx:base,vy:vy,life:120,w:7,h:7})
          }
          boss.movePattern='patrol'; boss.patternTimer=90; boss.patternCD=50
        }
      }
      break
    }
    case 'spin':{
      boss.x += (W/2-boss.w/2 - boss.x)*0.08
      boss.y += (40 - boss.y)*0.08
      boss.spinTimer++
      const spinInterval = boss.phase>=3?8:12
      if(boss.spinTimer%spinInterval===0 && boss.spinBursts>0){
        sfxBossShoot()
        boss.spinAngle += Math.PI*0.22
        const bx=boss.x+boss.w/2, by=boss.y+boss.h/2
        const numRays=boss.phase>=3?8:6
        for(let i=0;i<numRays;i++){
          const a=boss.spinAngle+(i/numRays)*Math.PI*2
          const spd=boss.phase>=3?3.0:2.2
          bossBullets.push({x:bx-3,y:by-3,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:130,w:7,h:7})
        }
        if(boss.spinTimer%(spinInterval*(numRays/2))===0) boss.spinBursts--
        if(boss.spinBursts<=0){ boss.movePattern='patrol'; boss.patternTimer=80; boss.patternCD=40 }
      }
      break
    }
    case 'laser':{
      boss.x += (W/2-boss.w/2 - boss.x)*0.06
      boss.y += (20 - boss.y)*0.06
      if(boss.laserWarning){
        boss.laserTimer--
        boss.laserX += (pl.x+pl.w/2 - boss.laserX)*0.04
        if(boss.laserTimer<=0){
          boss.laserWarning=false
          boss.laserActive=true; boss.laserActiveTimer=22
          sfxSlam()
          if(damageCD===0&&Math.abs((pl.x+pl.w/2)-boss.laserX)<14) hurt()
          addParticles(boss.laserX,boss.groundY,[255,60,0],30,1.8)
        }
      } else if(boss.laserActive){
        boss.laserActiveTimer--
        if(boss.laserActiveTimer<=0){
          boss.laserActive=false; boss.movePattern='patrol'; boss.patternTimer=80; boss.patternCD=50
        }
      }
      break
    }
    case 'collapse-chase':{
      const tx=pl.x+pl.w/2-boss.w/2, ty=pl.y-boss.h-4
      boss.x+=(tx-boss.x)*0.055; boss.y+=(ty-boss.y)*0.055
      boss.patternTimer--
      if(boss.patternTimer<=0){boss.movePattern='patrol';boss.patternTimer=50;boss.patternCD=20}
      boss.shootTimer--
      if(boss.shootTimer<=0){
        boss.shootTimer=14
        sfxBossShoot()
        const bx=boss.x+boss.w/2,by=boss.y+boss.h/2
        for(let i=0;i<3;i++){
          const a=(frameN*0.18)+(i/3)*Math.PI*2
          bossBullets.push({x:bx-3,y:by-3,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,life:120,w:7,h:7})
        }
      }
      break
    }
    case 'teleport':{
      boss.movePattern='patrol'
      boss.patternTimer=120
      break
    }
  }

  boss.shootTimer--
  if(boss.shootTimer<=0&&boss.movePattern!=='slam'&&!boss.slamWarning){
    boss.shootTimer=boss.shootInterval
    sfxBossShoot()
    const bx=boss.x+boss.w/2, by=boss.y+boss.h
    const dx=(pl.x+pl.w/2)-bx, dy=(pl.y+pl.h/2)-by
    const dist=Math.sqrt(dx*dx+dy*dy)||1
    const spd=boss.phase>=3?3.8:boss.phase===2?3.0:2.2
    bossBullets.push({x:bx-3,y:by,vx:dx/dist*spd,vy:dy/dist*spd,life:140,w:7,h:7})
    if(boss.phase>=2){
      bossBullets.push({x:bx-3,y:by,vx:dx/dist*spd-1.4,vy:dy/dist*spd,life:140,w:7,h:7})
      bossBullets.push({x:bx-3,y:by,vx:dx/dist*spd+1.4,vy:dy/dist*spd,life:140,w:7,h:7})
    }
    if(boss.phase>=3){
      bossBullets.push({x:bx-3,y:by,vx:0,vy:spd*1.1,life:140,w:7,h:7})
    }
  }
}

function updateBullets(){
  if(shootCD>0)shootCD--
  if(shootOverheat>0){
    shootOverheat--
    if(shootOverheat===0) shootAmmo=SHOOT_AMMO_MAX
  }
  for(const b of bullets){
    b.x+=b.vx; b.y+=b.vy; b.life--
    for(const p of allSolids()){if(aabb(b,p)){b.life=0;addParticles(b.x,b.y+1,[255,200,80],4,0.5);break}}
    for(const e of enemyObjs){
      if(b.life>0&&!e.dead&&aabb(b,e)){
        b.life=0; e.dead=true
        addParticles(e.x+e.w/2,e.y+e.h/2,[255,80,80],18,1.1)
        score+=e.type==='sniper'?30:e.type==='kamikaze'?25:20
        beep(440,'square',0.04,0.2); setTimeout(()=>beep(300,'square',0.05,0.15),40)
        break
      }
    }
    if(boss.alive&&b.life>0&&boss.shieldTimer===0&&aabb(b,boss)){
      b.life=0; boss.hp--; boss.hurtTimer=14; sfxBossHit()
      addParticles(boss.x+boss.w/2,boss.y+boss.h/2,[255,120,20],12,1.0)
      if(boss.hp<=0){
        boss.alive=false; sfxBossDead(); stopBossMusic()
        addParticles(boss.x+boss.w/2,boss.y+boss.h/2,[255,200,50],80,2.5)
        score+=500; 
        saveHighscore(99, score);
        setTimeout(()=>{state='win';sfxWin()},900)
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0)
  enemyObjs=enemyObjs.filter(e=>!e.dead)
}

function updateBossBullets(){
  for(const b of bossBullets){
    b.x+=b.vx;b.y+=b.vy;b.life--
    for(const p of fixedPlats){if(aabb(b,p)){b.life=0;break}}
    if(b.life>0&&aabb(playerBox(),b)){b.life=0;hurt()}
  }
  bossBullets=bossBullets.filter(b=>b.life>0)
}

function updatePlayer(){
  if(damageCD>0)damageCD--
  if(jetCD>0)jetCD--
  if(healCD>0)healCD--

  const jettingNow = held('Space')
  if(difficulty==='really-hard'){
    if(!jettingNow){ jetHeat=Math.max(0,jetHeat-1.4) }
    if(jetExplodeTimer>0){ jetExplodeTimer--; if(jetExplodeTimer===0)jetExploded=false }
  }
  if(jettingNow && !jetExploded){
    pl.vy-=charJetForce; pl.vy=Math.max(pl.vy,charMaxSpeedUp)
    pl.jetting=true; addJetTrail()
    if(jetCD===0){sfxJet();jetCD=10}
    if(difficulty==='really-hard'){
      jetHeat+=2.2
      if(jetHeat>=JET_HEAT_MAX){
        jetExploded=true; jetExplodeTimer=180; jetHeat=JET_HEAT_MAX
        beep(80,'sawtooth',0.35,0.5,30); beep(400,'square',0.1,0.2,60)
        addParticles(pl.x+pl.w/2,pl.y+pl.h,[255,140,0],30,1.6)
        hurt()
      }
    }
  } else {
    pl.jetting=false
  }
  pl.vy+=GRAV * (pl.jetting ? 0.35 : 1)
  pl.vy=Math.min(pl.vy,MAXSPEEDDOWN)

  const friction = currentPhase==='phase2' ? 0.7 : FRICTION
  if(held('KeyA')||held('ArrowLeft'))       {pl.vx-=WALK_ACCEL;pl.face=-1}
  else if(held('KeyD')||held('ArrowRight')) {pl.vx+=WALK_ACCEL;pl.face=1}
  else                                       {pl.vx*=friction}
  pl.vx=Math.max(-charWalkSpeed,Math.min(charWalkSpeed,pl.vx))

  if(pressed('KeyF')||pressed('KeyJ'))shoot()
  if(pressed('KeyH'))useHeal()

  pl.x+=pl.vx; pl.y+=pl.vy

  const solids=allSolids()
  for(const s of solids)resolveY(pl,s)
  for(const s of solids)resolveX(pl,s)
  for(const s of solids)if(aabb(pl,s))resolveY(pl,s)

  let cL=false,cR=false,cT=false,cB=false,sq=0
  for(const s of solids){
    if(aabb(pl,s)){
      const oT=(pl.y+pl.h)-s.y,oB=(s.y+s.h)-pl.y,oL=(pl.x+pl.w)-s.x,oR=(s.x+s.w)-pl.x
      const mn=Math.min(oT,oB,oL,oR)
      if(oT===mn&&oT<8){pl.y=s.y-pl.h;cT=true;sq++}
      else if(oB===mn&&oB<8){pl.y=s.y+s.h;cB=true;sq++}
      else if(oL===mn){cL=true;sq++}
      else{cR=true;sq++}
    }
  }
  if(damageCD===0&&sq>=2&&((cL&&cR)||(cT&&cB))){hurt();return}

  if(damageCD===0){
    for(const sg of spikeGroups){
      const hb=sg.wall?{x:sg.x,y:sg.y,w:sg.w,h:sg.h}:{x:sg.x,y:sg.y,w:sg.w,h:sg.h+14}
      if(aabb(pl,hb)){hurt();return}
    }
    for(const e of enemyObjs){
      if(aabb(playerBox(),e)){hurt();return}
    }
  }

  pl.x=Math.max(8,Math.min(worldW-pl.w-8,pl.x))

  if(pl.y+pl.h>H+20){hurt();respawnPlayer();pl.vy=-1;return}

  if(currentPhase==='phase2'&&boss.alive&&damageCD===0&&boss.collisionCooldown===0&&aabb(playerBox(),boss)){
    hurt()
    boss.collisionCooldown = 30
    return
  }

  if(currentPhase==='phase1'){
    if(selectedLevel === 1) {
      updateTutorial()
    }
    
    for(const s of starObjs){
      if(!s.got&&aabb(pl,{x:s.x-7,y:s.y-7,w:14,h:14})){
        s.got=true;score+=10;sfxCollect()
        addParticles(s.x,s.y,[255,240,60],18,1.4)
      }
    }
    for(const h of healObjs){
      if(!h.got&&healItems<3&&aabb(pl,{x:h.x-7,y:h.y-7,w:14,h:14})){
        h.got=true;healItems++;sfxHeal()
        addParticles(h.x,h.y,[80,255,120],24,1.2)
      }
    }
    for(const cp of checkpointObjs){
      if(!cp.activated&&aabb(pl,cp)){
        cp.activated=true
        checkpointSpawn={x:pl.x,y:pl.y}
        sfxCheckpoint()
        addParticles(cp.x+7,cp.y+12,[80,200,255],25,0.9)
      }
    }
    const sg=starObjs.filter(s=>s.got).length
    if(sg===starObjs.length&&aabb(pl,portal)){
      state='transition'
      addParticles(pl.x+pl.w/2,pl.y+pl.h/2,[80,220,255],25,1.2)
      saveHighscore(selectedLevel, score)
      
      if(selectedLevel < 6) {
        unlockLevel(selectedLevel+1)
      }
      
      if(selectedLevel === 6) {
        unlockBossFight()
        sfxWin()
        score += 100
        setTimeout(()=>{ 
          state='win'
        }, 600)
      } else {
        sfxWin(); score+=50
        setTimeout(()=>{ state='win' },400)
      }
    }
  }
  if(currentPhase==='phase2'){
    for(const h of healObjs){
      if(!h.got&&healItems<3&&aabb(pl,{x:h.x-7,y:h.y-7,w:14,h:14})){
        h.got=true; healItems++; sfxHeal()
        addParticles(h.x,h.y,[80,255,120],24,1.2)
      }
    }
  }
}

function updateParticles(){
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--}
  particles=particles.filter(p=>p.life>0)
}

// ==================== DRAW FUNCTIONS ====================

const nebulas1=Array.from({length:20},()=>({x:Math.random()*2400,y:Math.random()*270,rx:Math.random()*80+40,ry:Math.random()*45+25,col:Math.random()>0.5?[40,20,100]:[10,30,100],a:Math.random()*0.15+0.05}))
const nebulas2=Array.from({length:10},()=>({x:Math.random()*480,y:Math.random()*270,rx:Math.random()*60+30,ry:Math.random()*35+20,col:[120+Math.random()*40|0,Math.random()*30|0,Math.random()*20|0],a:Math.random()*0.22+0.06}))
const bgStarsArr=Array.from({length:200},()=>({x:Math.random()*2400,y:Math.random()*270,s:Math.random()*1.5+0.3,ph:Math.random()*Math.PI*2,sp:Math.random()*0.03+0.01}))

function drawBgStars(){
  for(const s of bgStarsArr){
    const sx=worldW>W?((s.x - camX*0.3 + 2400) % 2400):s.x
    const bri=0.35+0.35*Math.sin(frameN*s.sp+s.ph)
    cx.fillStyle=`rgba(190,210,255,${bri})`
    cx.fillRect(sx|0,s.y|0,s.s|0||1,s.s|0||1)
  }
}

function drawNebulas(){
  const nbs=currentPhase==='phase2'?nebulas2:nebulas1
  cx.save()
  if(worldW>W)cx.translate(-camX,0)
  for(const n of nbs){
    const grd=cx.createRadialGradient(n.x,n.y,0,n.x,n.y,Math.max(n.rx,n.ry))
    grd.addColorStop(0,`rgba(${n.col[0]},${n.col[1]},${n.col[2]},${n.a})`)
    grd.addColorStop(1,`rgba(${n.col[0]},${n.col[1]},${n.col[2]},0)`)
    cx.save();cx.scale(1,n.ry/n.rx)
    cx.fillStyle=grd;cx.beginPath();cx.arc(n.x,n.y*(n.rx/n.ry),n.rx,0,Math.PI*2);cx.fill()
    cx.restore()
  }
  cx.restore()
}

function drawTileBlock(x,y,w,h,base,acc,lit){
  const sx=x-camX
  if(sx+w<0||sx>W)return
  cx.fillStyle=base||'#1a2a4a';cx.fillRect(sx,y,w,h)
  cx.fillStyle=lit||'#2d4580';cx.fillRect(sx,y,w,2);cx.fillRect(sx,y,2,h)
  cx.fillStyle='rgba(0,0,0,0.35)';cx.fillRect(sx,y+h-1,w,1);cx.fillRect(sx+w-1,y,1,h)
  cx.fillStyle=acc||'#243560'
  for(let px=sx+7;px<sx+w-2;px+=8)cx.fillRect(px,y+1,1,h-2)
  for(let py=y+7;py<y+h-2;py+=8)cx.fillRect(sx+1,py,w-2,1)
}

function drawMovingPlat(mp){
  const sx=mp.x-camX
  if(sx+mp.w<0||sx>W)return
  drawTileBlock(mp.x,mp.y|0,mp.w,mp.h,'#143325','#1e4d38','#2a6648')
  cx.fillStyle=`rgba(60,255,140,${0.15+0.1*Math.sin(frameN*0.08)})`
  cx.fillRect(sx|0,mp.y|0,mp.w,mp.h)
  cx.fillStyle='#3dff8a';cx.fillRect(sx|0,mp.y|0,mp.w,1)
}

function drawSpikes(sg){
  const sx=sg.x-camX
  if(sx+sg.w<-20||sx>W+20)return
  if(sg.wall){
    cx.fillStyle='#0d1828';cx.fillRect(sx,sg.y,sg.w,sg.h)
    const cnt=Math.floor(sg.h/10);cx.fillStyle='#c8ddf0'
    for(let i=0;i<cnt;i++){
      const ty=sg.y+i*10;cx.beginPath()
      if(sg.dir==='right'){cx.moveTo(sx,ty);cx.lineTo(sx+sg.w+7,ty+5);cx.lineTo(sx,ty+10)}
      else{cx.moveTo(sx+sg.w,ty);cx.lineTo(sx-7,ty+5);cx.lineTo(sx+sg.w,ty+10)}
      cx.closePath();cx.fill()
    }
  } else {
    cx.fillStyle='#0d1828';cx.fillRect(sx,sg.y,sg.w,sg.h)
    const cnt=Math.floor(sg.w/9);cx.fillStyle='#c8ddf0'
    for(let i=0;i<cnt;i++){
      const tx=sx+i*9;cx.beginPath()
      if(sg.dir==='down'){cx.moveTo(tx,sg.y+sg.h);cx.lineTo(tx+4.5,sg.y+sg.h+10);cx.lineTo(tx+9,sg.y+sg.h)}
      else{cx.moveTo(tx,sg.y);cx.lineTo(tx+4.5,sg.y-10);cx.lineTo(tx+9,sg.y)}
      cx.closePath();cx.fill()
    }
    cx.fillStyle='#c8ddf0';cx.fillRect(sx,sg.dir==='down'?sg.y+sg.h-1:sg.y,sg.w,1)
  }
}

function drawStar(s){
  if(s.got)return
  const sx=s.x-camX
  if(sx<-20||sx>W+20)return
  const pulse=Math.sin(frameN*0.1+s.x)*1.5
  cx.save();cx.translate(sx|0,s.y|0);cx.rotate(s.angle)
  cx.shadowColor='#ffee44';cx.shadowBlur=6
  const r=7+pulse*0.3,ir=3
  cx.fillStyle='#ffee44';cx.beginPath()
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2-Math.PI/2,rad=i%2===0?r:ir
    if(i===0)cx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad)
    else cx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)
  }
  cx.closePath();cx.fill();cx.shadowBlur=0;cx.restore()
}

function drawHealItems(){
  for(const h of healObjs){
    if(h.got)continue
    const sx=h.x-camX
    if(sx<-20||sx>W+20)continue
    const pulse=1+Math.sin(frameN*0.15+h.x)*0.3
    cx.save();cx.translate(sx|0,h.y|0)
    cx.fillStyle='rgba(80,255,140,0.9)'
    cx.beginPath();cx.arc(0,0,5*pulse,0,Math.PI*2);cx.fill()
    cx.fillStyle='#ffffff';cx.fillRect(-1, -4, 2, 8)
    cx.fillRect(-4, -1, 8, 2)
    cx.restore()
  }
}

function drawEnemies(){
  for(const e of enemyObjs){
    if(e.dead)continue
    const sx=(e.x-camX)|0, sy=e.y|0
    cx.save()
    cx.translate(sx+e.w/2, sy+e.h/2)

    if(e.type==='grunt'){
      const alert=e.alertTimer>0
      const pulse=alert?1+Math.sin(frameN*0.4)*0.08:1
      cx.scale(pulse,pulse)
      cx.fillStyle='#555566'; cx.fillRect(-7,4,14,5)
      for(let i=-5;i<=5;i+=4){ cx.fillStyle='#888899'; cx.fillRect(i,5,2,4) }
      cx.fillStyle=alert?'#ff3322':'#cc4433'
      cx.fillRect(-6,-5,12,9)
      cx.fillStyle='rgba(255,180,160,0.35)'; cx.fillRect(-6,-5,12,3)
      cx.fillStyle=alert?'#ffff00':'#ff8800'
      cx.fillRect(-4,-3,8,4)
      cx.fillStyle='rgba(0,0,0,0.5)'; cx.fillRect(-4,-3,1,4); cx.fillRect(3,-3,1,4)
      cx.fillStyle='#cc4433'; cx.fillRect(-1,-9,2,4)
      cx.fillStyle=alert?'#ffff00':'#ff6644'
      cx.beginPath(); cx.arc(0,-10,2,0,Math.PI*2); cx.fill()
      if(alert){ cx.shadowColor='#ff4400'; cx.shadowBlur=8; cx.fillStyle='rgba(0,0,0,0)'; cx.fillRect(-7,-10,14,20) }
    } else if(e.type==='floater'){
      const bob=Math.sin(frameN*0.1+e.ox)*2
      cx.translate(0, bob)
      const anim=Math.sin(frameN*0.18+e.oy)
      cx.strokeStyle='#8844cc'; cx.lineWidth=1.5
      for(let i=0;i<4;i++){
        const ta=((i/4)*Math.PI*2)+frameN*0.06
        const tx=Math.cos(ta)*5, ty=Math.sin(ta)*4+3
        cx.beginPath(); cx.moveTo(tx*0.4,4); cx.quadraticCurveTo(tx,ty+2,tx,ty+6); cx.stroke()
      }
      const grd=cx.createRadialGradient(-2,-2,1,0,0,7)
      grd.addColorStop(0,'#cc88ff'); grd.addColorStop(1,'#6611aa')
      cx.fillStyle=grd; cx.beginPath(); cx.arc(0,0,7,0,Math.PI*2); cx.fill()
      cx.fillStyle='#220033'; cx.beginPath(); cx.ellipse(1,0,3,4,anim*0.2,0,Math.PI*2); cx.fill()
      cx.fillStyle='#ffffff'; cx.beginPath(); cx.arc(2,-1,1.2,0,Math.PI*2); cx.fill()
      cx.shadowColor='#aa44ff'; cx.shadowBlur=10
      cx.strokeStyle='rgba(180,100,255,0.4)'; cx.lineWidth=1; cx.beginPath(); cx.arc(0,0,8,0,Math.PI*2); cx.stroke()
    } else if(e.type==='kamikaze'){
      const charging=e.charging
      cx.rotate(e.charging ? Math.atan2(e.chargeVy,e.chargeVx) : Math.PI/2)
      if(charging){
        cx.fillStyle='#ffaa00'
        cx.beginPath(); cx.moveTo(-3,5); cx.lineTo(0,12+Math.random()*4); cx.lineTo(3,5); cx.closePath(); cx.fill()
        cx.fillStyle='#ffffff'
        cx.beginPath(); cx.moveTo(-1.5,5); cx.lineTo(0,9); cx.lineTo(1.5,5); cx.closePath(); cx.fill()
      }
      cx.fillStyle=charging?'#ff4400':'#ff8822'
      cx.beginPath(); cx.moveTo(0,-8); cx.lineTo(5,6); cx.lineTo(-5,6); cx.closePath(); cx.fill()
      cx.fillStyle='#ffcc44'
      cx.beginPath(); cx.moveTo(0,-8); cx.lineTo(2,-4); cx.lineTo(-2,-4); cx.closePath(); cx.fill()
      cx.fillStyle='#cc3300'
      cx.beginPath(); cx.moveTo(-5,4); cx.lineTo(-9,8); cx.lineTo(-3,8); cx.closePath(); cx.fill()
      cx.beginPath(); cx.moveTo(5,4); cx.lineTo(9,8); cx.lineTo(3,8); cx.closePath(); cx.fill()
      cx.fillStyle=charging?'#ffffff':'#ffff00'
      cx.beginPath(); cx.arc(0,0,2.5,0,Math.PI*2); cx.fill()
      if(charging){ cx.shadowColor='#ff6600'; cx.shadowBlur=12; cx.fillStyle='rgba(0,0,0,0)'; cx.fillRect(-10,-10,20,20) }
    } else if(e.type==='sniper'){
      const plCx=pl.x+pl.w/2, plCy=pl.y+pl.h/2
      const ang=Math.atan2(plCy-(e.y+e.h/2), plCx-(e.x+e.w/2))
      const readyToShoot=e.shootTimer<25
      cx.fillStyle='#334455'
      cx.fillRect(-7,-3,14,6)
      cx.fillStyle='#445566'; cx.fillRect(-7,-3,14,2)
      const grd2=cx.createRadialGradient(-1,-1,1,0,0,6)
      grd2.addColorStop(0,'#5588bb'); grd2.addColorStop(1,'#223344')
      cx.fillStyle=grd2; cx.beginPath(); cx.arc(0,-1,6,0,Math.PI*2); cx.fill()
      cx.save(); cx.rotate(ang)
      cx.fillStyle=readyToShoot?'#ffcc00':'#667788'
      cx.fillRect(0,-2,10,4)
      cx.fillStyle=readyToShoot?'#ffff88':'#99aacc'
      cx.fillRect(0,-1.5,9,1)
      cx.restore()
      cx.fillStyle=readyToShoot?'#ffff00':'#00ccff'
      cx.beginPath(); cx.arc(0,-1,3,0,Math.PI*2); cx.fill()
      cx.fillStyle='rgba(0,0,0,0.5)'; cx.beginPath(); cx.arc(1,-2,1.2,0,Math.PI*2); cx.fill()
      if(readyToShoot){ cx.shadowColor='#ffff00'; cx.shadowBlur=10; cx.fillStyle='rgba(0,0,0,0)'; cx.fillRect(-8,-8,16,16) }
    }
    cx.shadowBlur=0
    cx.restore()
  }
}

function drawBoss(){
  if(!boss.alive)return
  if(boss.teleportFlash>0&&Math.floor(boss.teleportFlash/3)%2===0)return
  const bx=boss.x|0, by=boss.y|0
  const ishurt=boss.hurtTimer>0
  const isShield=boss.shieldTimer>0

  if(boss.laserWarning){
    const pulse=0.4+0.6*Math.abs(Math.sin(frameN*0.4))
    const lx=boss.laserX|0
    cx.strokeStyle=`rgba(255,60,0,${pulse})`
    cx.lineWidth=3; cx.setLineDash([6,4])
    cx.beginPath(); cx.moveTo(lx,by+boss.h); cx.lineTo(lx,boss.groundY+boss.h); cx.stroke()
    cx.setLineDash([])
    cx.lineWidth=1
    cx.fillStyle=`rgba(255,80,0,${pulse})`
    cx.fillRect(lx-8,boss.groundY+boss.h-2,16,4)
  }
  if(boss.laserActive){
    const lx=boss.laserX|0
    const a=boss.laserActiveTimer/22
    cx.fillStyle=`rgba(255,120,0,${a})`
    cx.fillRect(lx-7,by+boss.h,14,boss.groundY+boss.h-(by+boss.h))
    cx.fillStyle=`rgba(255,255,200,${a*0.8})`
    cx.fillRect(lx-3,by+boss.h,6,boss.groundY+boss.h-(by+boss.h))
    cx.shadowColor='#ff6600'; cx.shadowBlur=16
    cx.fillStyle='rgba(0,0,0,0)'; cx.fillRect(lx-7,0,14,H)
    cx.shadowBlur=0
  }

  if(boss.movePattern==='spin'){
    const sa=boss.spinAngle+frameN*0.12
    const rc=boss.phase>=3?'rgba(255,80,0,0.45)':'rgba(200,50,255,0.35)'
    cx.strokeStyle=rc; cx.lineWidth=2
    cx.beginPath(); cx.arc(bx+boss.w/2,by+boss.h/2,26,sa,sa+Math.PI*1.5); cx.stroke()
    cx.beginPath(); cx.arc(bx+boss.w/2,by+boss.h/2,20,-sa,-sa+Math.PI); cx.stroke()
  }

  if(boss.slamWarning){
    const warnA=0.4+0.4*Math.sin(frameN*0.5)
    cx.fillStyle=`rgba(255,50,0,${warnA})`
    cx.fillRect(bx-4,by-4,boss.w+8,boss.h+8)
    cx.strokeStyle=`rgba(255,0,0,${warnA})`
    cx.lineWidth=2;cx.setLineDash([4,3])
    cx.beginPath();cx.moveTo(bx+boss.w/2,by+boss.h);cx.lineTo(bx+boss.w/2,boss.groundY+boss.h);cx.stroke()
    cx.setLineDash([])
  }
  if(isShield){
    const sa=0.5+0.3*Math.sin(frameN*0.2)
    cx.strokeStyle=`rgba(100,200,255,${sa})`
    cx.lineWidth=3;cx.beginPath();cx.arc(bx+boss.w/2,by+boss.h/2,boss.w*0.75,0,Math.PI*2);cx.stroke()
    cx.lineWidth=1
  }
  const bodyCol=ishurt?'#ffffff':isShield?'#88aaff':boss.phase===4?'#ff00ff':boss.phase===3?'#ff1100':boss.phase===2?'#ff6600':'#cc2244'
  cx.fillStyle=bodyCol;cx.fillRect(bx+4,by+10,boss.w-8,boss.h-10)
  cx.fillStyle=ishurt?'#ffaaaa':isShield?'#aaccff':boss.phase===4?'#cc00cc':'#aa1133'
  cx.fillRect(bx+8,by+2,boss.w-16,12)
  cx.fillStyle='#ff4400'
  cx.fillRect(bx+10,by+5,5,5);cx.fillRect(bx+boss.w-15,by+5,5,5)
  cx.fillStyle='#ffffff';cx.fillRect(bx+12,by+7,2,2);cx.fillRect(bx+boss.w-13,by+7,2,2)
  const hpR=boss.hp/bossMaxHP
  const cf=0.5+Math.sin(frameN*0.18)*0.3+(1-hpR)*0.4
  cx.fillStyle=`rgba(255,${60+hpR*120|0},20,${cf})`
  cx.beginPath();cx.arc(bx+boss.w/2,by+boss.h/2+4,8,0,Math.PI*2);cx.fill()
  const antRot=boss.movePattern==='spin'?boss.spinAngle:0
  cx.save(); cx.translate(bx+boss.w/2,by+2); cx.rotate(antRot*0.5)
  cx.fillStyle=ishurt?'#fff':'#ff4422'
  cx.fillRect(-boss.w/2+5,-6,3,9);cx.fillRect(boss.w/2-8,-6,3,9)
  cx.restore()
  const wf=Math.sin(frameN*0.28)*5
  cx.fillStyle=isShield?'rgba(80,160,255,0.6)':boss.movePattern==='spin'?'rgba(200,100,255,0.7)':boss.phase===4?'rgba(255,0,200,0.7)':'rgba(200,40,80,0.6)'
  cx.beginPath();cx.moveTo(bx,by+12);cx.lineTo(bx-14,by+12+wf);cx.lineTo(bx-4,by+24);cx.closePath();cx.fill()
  cx.beginPath();cx.moveTo(bx+boss.w,by+12);cx.lineTo(bx+boss.w+14,by+12+wf);cx.lineTo(bx+boss.w+4,by+24);cx.closePath();cx.fill()
  cx.shadowColor=boss.phase===4?'rgba(255,0,255,1)':boss.phase>=2?'rgba(255,20,60,0.9)':'rgba(255,20,60,0.5)'
  cx.shadowBlur=boss.phase===4?24:boss.phase>=3?18:boss.phase===2?12:6
  cx.fillStyle='rgba(0,0,0,0)';cx.fillRect(bx,by,boss.w,boss.h);cx.shadowBlur=0
}

const CASSIDY_HEAD=[[0,1,1,1,1,1,0],[1,1,5,6,5,1,1],[1,1,5,1,5,1,1],[0,1,1,1,1,1,0]]
const CASSIDY_HELMET=[[0,7,7,7,7,7,0],[7,7,7,7,7,7,7]]
const CASSIDY_LEGS=[[1,0,1,0,1],[1,0,1,0,1],[8,0,8,0,8]]
const PLR_PAL={1:'#f5c88a',2:'#e07830',3:'#f5a040',4:'#ffe0a0',5:'#ffffff',6:'#1a2060',7:'#b05818',8:'#2a1a08'}
const PLR_PAL_C={1:'#e0a8d8',2:'#c070a0',3:'#d08cb8',4:'#f0d0f0',5:'#ffffff',6:'#2a1060',7:'#a05888',8:'#3a1a38'}
const PLR_HURT={1:'#ff9090',2:'#ff5050',3:'#ff7070',4:'#ffb0b0',5:'#ffffff',6:'#440000',7:'#ff3030',8:'#330000'}

function drawPx(data,x,y,pal,sc){
  for(let r=0;r<data.length;r++)for(let c=0;c<data[r].length;c++){
    const v=data[r][c];if(!v)continue
    cx.fillStyle=pal[v];cx.fillRect((x+c*sc)|0,(y+r*sc)|0,sc,sc)
  }
}

function drawPlayer(){
  if(state==='dying')return
  const vis=damageCD===0||Math.floor(damageCD/6)%2===0
  if(!vis)return
  const sc=selectedCharacter==='cassidy'
  const body=sc?CASSIDY_BODY:DAVE_BODY,head=sc?CASSIDY_HEAD:DAVE_HEAD
  const helm=sc?CASSIDY_HELMET:DAVE_HELMET,legs=sc?CASSIDY_LEGS:DAVE_LEGS
  const pal=sc?(damageCD>0?PLR_C_HURT:PLR_PAL_C):(damageCD>0?PLR_HURT:PLR_PAL)
  const sx=(pl.x+pl.w/2-camX)|0
  cx.save();cx.translate(sx,pl.y|0)
  if(pl.face<0)cx.scale(-1,1)
  const ox=-5
  drawPx(helm,ox-1,-1,pal,1);drawPx(head,ox,2,pal,1);drawPx(body,ox-1,6,pal,1)
  cx.fillStyle='#5a7088';cx.fillRect(ox-5,7,4,6)
  cx.fillStyle='#3a5068';cx.fillRect(ox-6,8,3,5)
  if(pl.jetting){
    const f=frameN%4<2
    cx.fillStyle=f?'#ff8800':'#ffcc00';cx.fillRect(ox-5,13,3,4)
    cx.fillStyle='#ffffff';cx.fillRect(ox-4,14,2,2)
  }
  drawPx(legs,ox,11,pal,1)
  cx.restore()
}

  cx.fillText('FASE CONCLUÍDA!',W/2,108);cx.shadowBlur=0
  cx.font='8px monospace';cx.fillStyle='#ffccaa'
  cx.fillText(selectedLevel===6?'BOSS FIGHT DESBLOQUEADO!':'PRÓXIMA FASE!',W/2,128)
  cx.restore()
}

function drawArenaBackground(){
  cx.fillStyle='rgba(60,10,5,0.35)';cx.fillRect(0,0,W,H)
  cx.strokeStyle='rgba(80,15,8,0.25)';cx.lineWidth=1
  for(let x=0;x<W;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
  for(let y=0;y<H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
}

function drawMenuScreen(){
  cx.fillStyle='rgba(4,6,22,0.85)';cx.fillRect(0,0,W,H)
  for(const star of menuStars){
    star.x+=star.vx;star.y+=star.vy
    if(star.x>W+5)star.x=-5
    if(star.y<-5||star.y>H+5){star.y=Math.random()*H;star.x=-5}
    cx.fillStyle=`rgba(255,255,200,${star.opacity})`;cx.fillRect(star.x,star.y,star.size,star.size)
  }
  cx.save();cx.textAlign='center'
  const bob=Math.sin(frameN*0.03)*4,rot=Math.sin(frameN*0.02)*4*Math.PI/180
  if(logoImg.complete&&logoImg.width>0){
    cx.save();cx.translate(W/2,20+bob+60);cx.rotate(rot);cx.drawImage(logoImg,-120,-60,240,120);cx.restore()
  } else {
    cx.font='bold 20px monospace';cx.fillStyle='#00eeff';cx.shadowColor='#00eeff';cx.shadowBlur=12
    cx.fillText('DAVE SPACE DIVER',W/2,70+bob);cx.shadowBlur=0
  }
  const blink=Math.floor(frameN/22)%2
  cx.fillStyle=blink?'#ffffff':'#556688';cx.shadowColor=blink?'#aaddff':'transparent';cx.shadowBlur=blink?6:0
  cx.font='8px monospace';cx.fillText('[ SPACE ] PARA JOGAR',W/2,145);cx.shadowBlur=0
  cx.fillStyle='#445566';cx.font='6px monospace'
  cx.fillText('A/D=MOVER  SPACE=JETPACK  F=ATIRAR  H=CURAR',W/2,165)
  cx.fillText('TODAS AS FASES COM SCROLL HORIZONTAL!',W/2,177)
  cx.restore()
}

function drawLevelSelect(){
  cx.fillStyle='rgba(4,6,22,0.88)';cx.fillRect(0,0,W,H)
  cx.save();cx.font='bold 18px monospace';cx.textAlign='center'
  cx.fillStyle='#00ff88';cx.shadowColor='#00ff88';cx.shadowBlur=12
  cx.fillText('ESCOLHA A FASE',W/2,32);cx.shadowBlur=0
  
  bossFightUnlocked = getBossUnlocked()
  
  if(bossFightUnlocked) {
    cx.fillStyle = selectedGameMode === 'bossfight' ? '#ff00aa' : '#660066'
    cx.fillRect(W/2-80, 220, 160, 30)
    cx.strokeStyle = '#ff00aa'
    cx.strokeRect(W/2-80, 220, 160, 30)
    cx.fillStyle = '#ffffff'
    cx.font = 'bold 8px monospace'
    cx.fillText('⚔️ BOSS FIGHT ⚔️', W/2, 240)
  }
  
  const configs=[
    {col:{bgA:'#1a3a2a',bgI:'#0a1a0a',borA:'#00ff88',borI:'#004422',tx:'#88ff88',st:'#88dd88'}},
    {col:{bgA:'#3a2a1a',bgI:'#1a1a0a',borA:'#ffff00',borI:'#666600',tx:'#ffff88',st:'#ffdd88'}},
    {col:{bgA:'#3a1a2a',bgI:'#1a0a0a',borA:'#ff0088',borI:'#660033',tx:'#ff88cc',st:'#ff88bb'}},
    {col:{bgA:'#2a3a1a',bgI:'#1a1a0a',borA:'#ffff00',borI:'#666600',tx:'#ffff88',st:'#ffdd88'}},
    {col:{bgA:'#1a2a3a',bgI:'#0a1a1a',borA:'#00ffff',borI:'#004466',tx:'#88ffff',st:'#88dddd'}},
    {col:{bgA:'#2a1a3a',bgI:'#180a28',borA:'#ff44ff',borI:'#660066',tx:'#ff88ff',st:'#ff66ff'}},
  ]
  const unlocked=getUnlocked()
  for(let i=1;i<=6;i++){
    const c=configs[i-1].col
    const x=15+(i-1)*75, y=60, cs=65
    const sel=selectedLevel===i && selectedGameMode !== 'bossfight'
    const isLocked=!unlocked.includes(i)
    cx.fillStyle=isLocked?'#0a0a12':sel?c.bgA:c.bgI;cx.fillRect(x,y,cs,cs)
    cx.strokeStyle=isLocked?'#222233':sel?c.borA:c.borI;cx.lineWidth=2;cx.strokeRect(x,y,cs,cs)
    if(isLocked){
      cx.fillStyle='#334455'; cx.font='bold 20px monospace'; cx.textAlign='center'
      cx.fillText('🔒',x+cs/2,y+cs/2+4)
      cx.font='5px monospace'; cx.fillStyle='#224433'
      cx.fillText(`FASE ${i}`,x+cs/2,y+14)
    } else {
      cx.fillStyle=c.tx;cx.font='bold 9px monospace';cx.textAlign='center'
      cx.fillText(`FASE ${i}`,x+cs/2,y+14)
      const hs=getHighscore(i)
      if(hs>0){ cx.font='4px monospace'; cx.fillStyle='#ffcc44'; cx.fillText(`★${hs}`,x+cs/2,y+38) }
      cx.font='bold 6px monospace';cx.fillStyle=c.st
      cx.fillText('★'.repeat(Math.min(4,i))+'☆'.repeat(4-Math.min(4,i)),x+cs/2,y+56)
    }
  }
  const blink=Math.floor(frameN/22)%2
  cx.fillStyle=blink?'#ffffff':'#445566';cx.font='6px monospace';cx.textAlign='center'
  cx.fillText('A/D p/ selecionar fase  ·  SPACE p/ começar',W/2,152)
  if(bossFightUnlocked) {
    cx.fillStyle='#ffaa44'
    cx.fillText('Aperte B para entrar no BOSS FIGHT!',W/2,210)
  }
  cx.fillStyle='#88ffaa';cx.font='bold 6px monospace'
  cx.fillText('FASES MANUAIS COM DESIGN BULLET HELL!',W/2,266)
  cx.restore()
}

function drawDifficultySelect(){
  cx.fillStyle='rgba(4,6,22,0.92)';cx.fillRect(0,0,W,H)
  cx.save();cx.textAlign='center'
  cx.font='bold 16px monospace';cx.fillStyle='#ffcc44';cx.shadowColor='#ffaa00';cx.shadowBlur=12
  cx.fillText('DIFICULDADE',W/2,40);cx.shadowBlur=0

  const opts=[
    {id:'normal',   label:'NORMAL',    sub:'3 vidas · inimigos lentos · boss 20HP',     col:'#44ee88', bg:'#0a2a12', brd:'#226633'},
    {id:'hard',     label:'HARD',      sub:'3 vidas · inimigos +45% · boss 40HP',       col:'#ff8800', bg:'#2a1600', brd:'#883300'},
    {id:'really-hard',label:'SUPER HARD',sub:'3 vidas · inimigos +90% · boss 70HP\n⚠ Jetpack EXPLODE ao superaquecer', col:'#ff00cc', bg:'#2a0020', brd:'#880066'},
  ]
  opts.forEach((o,i)=>{
    const y=70+i*60, h=50, x=40, w=W-80
    const sel=difficulty===o.id
    cx.fillStyle=sel?o.bg:'#08090f'; cx.fillRect(x,y,w,h)
    cx.strokeStyle=sel?o.col:o.brd; cx.lineWidth=sel?2:1; cx.strokeRect(x,y,w,h)
    if(sel){ cx.fillStyle=o.col+'22'; cx.fillRect(x,y,w,h) }
    cx.font='bold 10px monospace'; cx.fillStyle=sel?o.col:'#666688'
    cx.fillText(o.label,W/2,y+16)
    cx.font='5px monospace'; cx.fillStyle=sel?'#ccccdd':'#445566'
    const lines=o.sub.split('\n')
    lines.forEach((l,li)=>cx.fillText(l,W/2,y+28+li*9))
    if(sel){ cx.font='7px monospace'; cx.fillStyle=o.col; cx.fillText('◀ ▶',W/2,y+h-6) }
  })

  const blink=Math.floor(frameN/22)%2
  cx.font='7px monospace'; cx.fillStyle=blink?'#ffffff':'#445566'
  cx.fillText('A/D p/ escolher · SPACE p/ confirmar',W/2,258)
  cx.restore()
}

function drawCharacterSelect(){
  cx.fillStyle='rgba(4,6,22,0.88)';cx.fillRect(0,0,W,H)
  cx.save();cx.font='bold 18px monospace';cx.textAlign='center'
  cx.fillStyle='#00eeff';cx.shadowColor='#00eeff';cx.shadowBlur=12
  cx.fillText('ESCOLHA SEU ASTRONAUTA',W/2,50);cx.shadowBlur=0
  const daveBg=selectedCharacter==='dave'?'#1a4a60':'#0a2a40'
  cx.fillStyle=daveBg;cx.fillRect(20,80,200,150)
  cx.strokeStyle=selectedCharacter==='dave'?'#00ff88':'#004466';cx.lineWidth=2;cx.strokeRect(20,80,200,150)
  cx.fillStyle='#ffdd88';cx.font='bold 14px monospace';cx.textAlign='center';cx.fillText('DAVE',120,100)
  cx.save();cx.translate(120,130);cx.scale(2,2)
  drawPx(DAVE_HELMET,-3,-1,PLR_PAL,1);drawPx(DAVE_HEAD,-2,2,PLR_PAL,1)
  drawPx(DAVE_BODY,-3,6,PLR_PAL,1);drawPx(DAVE_LEGS,-2,11,PLR_PAL,1)
  cx.restore()
  cx.fillStyle='#88aacc';cx.font='7px monospace';cx.textAlign='center'
  cx.fillText('Velocidade média',120,195);cx.fillText('Jetpack normal',120,205)
  cx.fillStyle=selectedCharacter==='cassidy'?'#4a1a6a':'#2a0a4a'
  cx.fillRect(260,80,200,150)
  cx.strokeStyle=selectedCharacter==='cassidy'?'#ff00ff':'#660088';cx.lineWidth=2;cx.strokeRect(260,80,200,150)
  cx.fillStyle='#ffaaff';cx.font='bold 14px monospace';cx.textAlign='center';cx.fillText('CASSIDY',360,100)
  cx.save();cx.translate(360,130);cx.scale(2,2)
  drawPx(CASSIDY_HELMET,-3,-1,PLR_PAL_C,1);drawPx(CASSIDY_HEAD,-2,2,PLR_PAL_C,1)
  drawPx(CASSIDY_BODY,-3,6,PLR_PAL_C,1);drawPx(CASSIDY_LEGS,-2,11,PLR_PAL_C,1)
  cx.restore()
  cx.fillStyle='#dd88ff';cx.font='7px monospace';cx.textAlign='center'
  cx.fillText('Velocidade alta',360,195);cx.fillText('Jetpack reforçado',360,205)
  const blink=Math.floor(frameN/22)%2
  cx.fillStyle=blink?'#ffffff':'#445566';cx.font='8px monospace';cx.textAlign='center'
  cx.fillText('A/D selecionar  ·  [ SPACE ] começar',W/2,260)
  cx.restore()
}

function update(){
  frameN++
  if(state==='character-select'){
    stopMenuMusic()
    if(held('KeyA')||held('ArrowLeft'))selectedCharacter='dave'
    else if(held('KeyD')||held('ArrowRight'))selectedCharacter='cassidy'
    if(pressed('Space')||pressed('Enter'))state='menu'
    clearJust();return
  }
  if(state==='difficulty-select'){
    if(pressed('KeyA')||pressed('ArrowLeft')){
      if(difficulty==='really-hard')difficulty='hard'
      else if(difficulty==='hard')difficulty='normal'
    }
    if(pressed('KeyD')||pressed('ArrowRight')){
      if(difficulty==='normal')difficulty='hard'
      else if(difficulty==='hard')difficulty='really-hard'
    }
    if(pressed('Space')||pressed('Enter')){ state='level-select' }
    clearJust();return
  }
  if(state==='menu'){
    initAudioElements()
    if(menuAudioElem.paused)startMenuMusic()
    if(pressed('Space')||pressed('Enter')){startMenuJingle();stopMenuMusic();state='difficulty-select'}
    if(pressed('KeyA')||pressed('ArrowLeft')||pressed('KeyD')||pressed('ArrowRight'))startMenuJingle()
    clearJust();return
  }
  if(state==='level-select'){
    bossFightUnlocked = getBossUnlocked()
    const unlocked=getUnlocked()
    
    if(pressed('KeyA')||pressed('ArrowLeft')) {
      if(selectedGameMode === 'bossfight') {
        selectedGameMode = 'level'
        selectedLevel = Math.min(6, selectedLevel)
      } else {
        selectedLevel=Math.max(1,selectedLevel-1)
      }
    }
    if(pressed('KeyD')||pressed('ArrowRight')) {
      if(selectedGameMode === 'bossfight') {
        selectedGameMode = 'level'
        selectedLevel = Math.min(6, selectedLevel)
      } else {
        selectedLevel=Math.min(6,selectedLevel+1)
      }
    }
    if(pressed('KeyB') && bossFightUnlocked) {
      selectedGameMode = 'bossfight'
    }
    if(pressed('Space')||pressed('Enter')){
      if(selectedGameMode === 'bossfight' && bossFightUnlocked) {
        initGame()
        if(AC.state==='suspended')AC.resume()
      } else if(unlocked.includes(selectedLevel)) {
        selectedGameMode = 'level'
        initGame()
        if(AC.state==='suspended')AC.resume()
      }
    }
    clearJust();return
  }
  if(state==='transition'){updateParticles();clearJust();return}
  if(state==='dying'){
    deathTimer--;updateParticles()
    if(deathTimer<=0)state='dead'
    if(pressed('Space')||pressed('Enter')){stopMusic();stopBossMusic();state='character-select';clearJust();return}
    clearJust();return
  }
  if(state==='dead'||state==='win'){
    updateParticles()
    if(pressed('Space')||pressed('Enter')){stopMusic();stopBossMusic();state='character-select'}
    clearJust();return
  }
  updateMovPlats()
  updateEnemies()
  if(currentPhase==='phase1')updateEnemyBullets()
  updatePlayer()
  updateBullets()
  if(currentPhase==='phase2'){updateBoss();updateBossBullets()}
  updateParticles()
  for(const s of starObjs)s.angle+=0.04
  updateCamera()
  clearJust()
}

function draw(){
  const isArena=currentPhase==='phase2'
  cx.fillStyle=isArena?'#120303':'#07091f';cx.fillRect(0,0,W,H)
  drawBgStars()
  drawNebulas()
  if(state==='character-select'){drawCharacterSelect();return}
  if(state==='difficulty-select'){drawDifficultySelect();return}
  if(state==='menu'){drawMenuScreen();return}
  if(state==='level-select'){drawLevelSelect();return}
  if(state==='transition'){drawTransition();drawParticles();return}
  if(isArena)drawArenaBackground()
  for(const sg of spikeGroups)drawSpikes(sg)
  for(const fp of fixedPlats)drawTileBlock(fp.x,fp.y,fp.w,fp.h,fp.col||'#1a2a4a','#243560','#2d4580')
  for(const mp of movPlats)drawMovingPlat(mp)
  if(currentPhase==='phase1'){
    for(const s of starObjs)drawStar(s)
    drawHealItems()
    drawEnemies()
    drawEnemyBullets()
    drawPortal()
    drawCheckpoints()
    drawTutorialMessages()
  }
  drawBoss()
  drawBossBullets()
  drawBullets()
  drawParticles()
  drawPlayer()
  if(damageCD>0&&damageCD<130){
    cx.fillStyle=`rgba(255,40,40,${(damageCD/130)*0.35})`;cx.fillRect(0,0,W,H)
  }
  cx.font='7px monospace';cx.textAlign='left'
  drawHUD()
  drawCrosshair()
  if(state==='dead'){
    const msg=currentPhase==='phase2'?'BOSS DERROTOU VOCÊ...':'GAME OVER!'
    drawOverlay('GAME OVER','#ff4444',`PONTUAÇÃO: ${score} pts`,msg,'#ff2222')
  }
  if(state==='win'){
    if(selectedGameMode === 'bossfight') {
      drawOverlay('VITÓRIA!','#ffee44',`PONTUAÇÃO FINAL: ${score} pts`,'BOSS DERROTADO! PARABÉNS!','#ffdd00')
    } else if(selectedLevel === 6) {
      drawOverlay('FASE CONCLUÍDA!','#00ff88',`PONTUAÇÃO: ${score} pts`,'BOSS FIGHT DESBLOQUEADO!','#00ff88')
    } else {
      drawOverlay('FASE CONCLUÍDA!','#00ff88',`PONTUAÇÃO: ${score} pts`,'PRÓXIMA FASE DESBLOQUEADA!','#00ff88')
    }
  }
}

let lastTime=0
function loop(ts){
  const dt=ts-lastTime
  if(dt>=16.67){lastTime=ts-(dt%16.67);update();draw()}
  requestAnimationFrame(loop)
}
requestAnimationFrame(loop)
</script>
